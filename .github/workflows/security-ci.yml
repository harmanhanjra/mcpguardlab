name: security-ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --extra test --extra dev
      - name: Unit tests
        run: uv run pytest --cov=mcpguardlab --cov-report=term-missing
      - name: Ruff
        run: uv run ruff check .
      - name: Bandit
        run: uv run bandit -r src -ll
